# Type check, lint, tests and build on every push (FLU-101). Nothing here needs a secret: the
# database tests use a Postgres service, and the build runs without .env.
name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Same image and credentials as docker-compose.yml. The db tests create fluency_test in it.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fluency
          POSTGRES_PASSWORD: fluency
          POSTGRES_DB: fluency
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluency -d fluency"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      # Installs the pnpm version in package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:db
      - run: pnpm build
