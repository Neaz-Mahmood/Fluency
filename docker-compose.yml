# Local development database. Not used in production.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fluency
      POSTGRES_PASSWORD: fluency
      POSTGRES_DB: fluency
    ports:
      - "5432:5432"
    volumes:
      - fluency-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluency -d fluency"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  fluency-db:
